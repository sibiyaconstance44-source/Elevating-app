plugins {
    id 'com.android.application'
}

android {
    namespace 'com.elevateaitutor.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.elevateaitutor.app'
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName '1.0.2'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        manifestPlaceholders = [
                hostName: 'ais-pre-6ockz5tdbznoghyafem3vj-389253933923.europe-west2.run.app',
                defaultUrl: 'https://ais-pre-6ockz5tdbznoghyafem3vj-389253933923.europe-west2.run.app',
                assetStatements: '[]'
        ]
    }

    signingConfigs {
        release {
            def keystorePropertiesFile = rootProject.file("keystore.properties")
            if (keystorePropertiesFile.exists()) {
                def keystoreProperties = new Properties()
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    
    // Force all Kotlin libraries to use the same version to prevent duplicate class errors
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
}
